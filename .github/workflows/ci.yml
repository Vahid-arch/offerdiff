name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build
      # BrowserPageSource tests drive a real headless Chromium; --with-deps adds the system libraries on Linux
      - name: Install Chromium
        run: pwsh tests/OfferDiff.Render.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - run: dotnet test --no-build
