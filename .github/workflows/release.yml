name: Release

# Runs when a version tag such as v0.2.0 is pushed: test, build single-file binaries, publish a pre-release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build
      - run: dotnet test --no-build

      # Fail early, before any publishing, if the changelog or User-Agent was not updated for this tag.
      - name: Check version and extract release notes
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"; exit 1
          fi
          if ! grep -q "\"OfferDiff/$version " src/OfferDiff.Core/HttpPageSource.cs; then
            echo "::error::HttpPageSource.UserAgent does not say OfferDiff/$version"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: release-notes
          path: notes.md

  publish:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - { rid: win-x64, os: ubuntu-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          # macOS binaries are built on macOS so the SDK can code-sign them (required on Apple silicon)
          - { rid: osx-x64, os: macos-latest }
          - { rid: osx-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish and zip
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish src/OfferDiff.Cli -c Release -r ${{ matrix.rid }} \
            -p:SelfContained=true -p:PublishSingleFile=true \
            -p:Version="$version" -p:DebugType=none -o publish
          [ -f publish/offerdiff ] && chmod +x publish/offerdiff
          zip_name="offerdiff-$version-${{ matrix.rid }}.zip"
          (cd publish && zip -q -r "../$zip_name" .)
          zip -q -j "$zip_name" LICENSE README.md
          echo "ZIP_NAME=$zip_name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum offerdiff-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --prerelease --title "OfferDiff ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md offerdiff-*.zip SHA256SUMS.txt
