name: Release

# Runs when a version tag such as v0.3.0 is pushed: test, build single-file binaries, publish a pre-release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build
      # BrowserPageSource and --render tests drive a real headless Chromium; --with-deps adds the system libraries on Linux
      - name: Install Chromium
        run: pwsh tests/OfferDiff.Render.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - run: dotnet test --no-build

      # Fail early, before any publishing, if the changelog, User-Agent or version was not updated for this tag.
      - name: Check version and extract release notes
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"; exit 1
          fi
          if ! grep -q "\"OfferDiff/$version " src/OfferDiff.Core/HttpPageSource.cs; then
            echo "::error::HttpPageSource.UserAgent does not say OfferDiff/$version"; exit 1
          fi
          if ! grep -q "<Version>$version</Version>" Directory.Build.props; then
            echo "::error::Directory.Build.props does not say <Version>$version</Version>"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: release-notes
          path: notes.md

  publish:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - { rid: win-x64, os: ubuntu-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          # macOS binaries are built on macOS so the SDK can code-sign them (required on Apple silicon)
          - { rid: osx-x64, os: macos-latest }
          - { rid: osx-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # One publish, two downloads: "offerdiff" is the program alone (fixture and --live modes; --render explains which
      # download to get), "offerdiff-render" adds the Playwright driver (.playwright folder) that --render needs.
      - name: Publish and zip
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish src/OfferDiff.Cli -c Release -r ${{ matrix.rid }} \
            -p:SelfContained=true -p:PublishSingleFile=true \
            -p:Version="$version" -p:DebugType=none -o publish
          [ -f publish/offerdiff ] && chmod +x publish/offerdiff
          # the driver runs a bundled Node.js, which must stay executable on Linux and macOS
          find publish/.playwright -type f -name node -exec chmod +x {} +
          core="offerdiff-$version-${{ matrix.rid }}.zip"
          render="offerdiff-render-$version-${{ matrix.rid }}.zip"
          exe=offerdiff; [ -f publish/offerdiff.exe ] && exe=offerdiff.exe
          (cd publish && zip -q "../$core" "$exe")
          (cd publish && zip -q -r "../$render" .)
          zip -q -j "$core" LICENSE README.md
          zip -q -j "$render" LICENSE README.md
          # guard the split: the core zip must not carry the driver, the render zip must
          if unzip -l "$core" | grep -q "\.playwright/"; then echo "::error::$core contains .playwright"; exit 1; fi
          if ! unzip -l "$render" | grep -q "\.playwright/"; then echo "::error::$render has no .playwright folder"; exit 1; fi
          unzip -l "$core"
          echo "CORE_ZIP=$core" >> "$GITHUB_ENV"
          echo "RENDER_ZIP=$render" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: offerdiff-${{ matrix.rid }}
          path: |
            ${{ env.CORE_ZIP }}
            ${{ env.RENDER_ZIP }}

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum offerdiff-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --prerelease --title "OfferDiff ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md offerdiff-*.zip SHA256SUMS.txt
