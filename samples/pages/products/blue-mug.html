<!doctype html>
<html><head><title>Blue Mug - Example Store</title>
<!-- pattern: single Product with one Offer -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Product",
  "name": "Blue Mug",
  "sku": "MUG-BLUE",
  "offers": {
    "@type": "Offer",
    "url": "https://example-store.test/products/blue-mug",
    "price": 12.99,
    "priceCurrency": "USD",
    "availability": "https://schema.org/InStock"
  }
}
</script>
</head><body><h1>Blue Mug</h1><p>$12.99</p></body></html>
