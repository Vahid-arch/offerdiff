<!doctype html>
<html><head><title>Linen Apron - Example Store</title>
<!-- pattern: ProductGroup with hasVariant; each variant has its own sku, url and offer -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProductGroup",
  "name": "Linen Apron",
  "productGroupID": "APRON-LINEN",
  "variesBy": "https://schema.org/size",
  "hasVariant": [
    {
      "@type": "Product", "name": "Linen Apron, Small", "sku": "APRON-LINEN-S",
      "offers": { "@type": "Offer", "url": "https://example-store.test/products/linen-apron?variant=1",
                  "price": 27.00, "priceCurrency": "USD", "availability": "https://schema.org/InStock" }
    },
    {
      "@type": "Product", "name": "Linen Apron, Medium", "sku": "APRON-LINEN-M",
      "offers": { "@type": "Offer", "url": "https://example-store.test/products/linen-apron?variant=2",
                  "price": 29.00, "priceCurrency": "USD", "availability": "https://schema.org/PreOrder" }
    },
    {
      "@type": "Product", "name": "Linen Apron, Large", "sku": "APRON-LINEN-L",
      "offers": { "@type": "Offer", "url": "https://example-store.test/products/linen-apron?variant=3",
                  "price": 31.00, "priceCurrency": "USD", "availability": "https://schema.org/BackOrder" }
    }
  ]
}
</script>
</head><body><h1>Linen Apron</h1><p>From $27.00</p></body></html>
